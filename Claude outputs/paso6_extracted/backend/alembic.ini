[alembic]
script_location = alembic
prepend_sys_path = . src
path_separator = os
# La URL real la inyecta env.py desde DATABASE_URL (.env). Se deja vacía
# aquí a propósito: así el mismo alembic.ini sirve para SQLite en dev y
# MySQL en la puerta de salida de la fase, sin tocar este fichero.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
