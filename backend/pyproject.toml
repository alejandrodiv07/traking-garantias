[project]
name = "prime-backend"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "sqlalchemy",
    "alembic",
    "argon2-cffi",
    "fastapi",
    "uvicorn",
]

[project.optional-dependencies]
test = [
    "pytest",
    "httpx",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: crypto real (Argon2id de argon2-cffi); excluir con -m \"not slow\" para feedback rapido",
]

[tool.coverage.run]
branch = true
source = ["prime.identity.domain"]
